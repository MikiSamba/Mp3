name: Build APK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew assembleDebug --no-daemon
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mp3.apk
          for i in 1 2 3; do
            gh release delete-asset latest Mp3.apk -y 2>/dev/null || true
            gh release upload latest Mp3.apk && exit 0
            gh release create latest Mp3.apk --title "Mp3 (ultima build)" --notes "APK compilato automaticamente dall'ultimo commit su main." && exit 0
            echo "tentativo $i fallito, riprovo tra 15s"; sleep 15
          done
          exit 1
