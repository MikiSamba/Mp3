name: Build APK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Keystore dai secret
        run: echo "$KEYSTORE_B64" | base64 -d > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Mp3.apk
          for i in 1 2 3; do
            gh release delete-asset latest Mp3.apk -y 2>/dev/null || true
            gh release upload latest Mp3.apk && gh release edit latest --title "Musica (ultima build)" --notes "build=$GITHUB_RUN_NUMBER" && exit 0
            gh release create latest Mp3.apk --title "Musica (ultima build)" --notes "build=$GITHUB_RUN_NUMBER" && exit 0
            echo "tentativo $i fallito, riprovo tra 15s"; sleep 15
          done
          exit 1
